<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Queen’s Court Finder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1a1c22;--mut:#5d6270;--bd:#dedbd2;--acc:#002452;--accon:#fff;--red:#9d1939;--gold:#ebb700;--goldtx:#1a1300;--ok:#1b6b3a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11151d;--card:#1a2030;--tx:#eceef3;--mut:#9aa3b5;--bd:#2c3448;--acc:#8fb3f0;--accon:#0b1220;--red:#f08ba3;--ok:#6fd49a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--accon);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;background:var(--acc);color:var(--accon);font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.alt{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.line{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;background:var(--gold);color:var(--goldtx);font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}
.chip{display:inline-block;border:1px solid var(--bd);color:var(--mut);font-size:12px;padding:1px 8px;border-radius:999px;margin:2px 4px 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.meta{color:var(--mut);font-size:14px}
.need{font-weight:700}
.full{color:var(--ok);font-weight:700}
.note{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;margin:0;color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;font-size:14px;cursor:pointer;width:auto}
.checks input{width:auto;margin:0}
.who{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--acc);color:var(--accon);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity
